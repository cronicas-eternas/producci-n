<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index — Crónicas Eternas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#080503;font-family:'Inter',sans-serif;color:#c8a86a;}

/* ── FIXED BUTTONS ── */
.btn-home{
  position:fixed;top:18px;left:18px;z-index:9000;
  background:rgba(8,5,3,0.88);border:1px solid rgba(201,168,76,0.3);border-radius:20px;
  padding:7px 18px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:rgba(201,168,76,0.65);text-decoration:none;
  transition:all .25s;backdrop-filter:blur(8px);
}
.btn-home:hover{color:#C9A84C;border-color:rgba(201,168,76,0.7);}

.btn-lang{
  position:fixed;top:18px;right:18px;z-index:9000;
  background:rgba(8,5,3,0.88);border:1.5px solid rgba(201,168,76,0.3);border-radius:22px;
  padding:8px 20px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:2.5px;
  text-transform:uppercase;display:inline-flex;gap:5px;align-items:center;
  backdrop-filter:blur(8px);text-decoration:none;
}
.lang-active{color:#C9A84C;font-weight:700;letter-spacing:3px;}
.lang-sep{color:#5a4020;}
.lang-link{color:#5a4020;text-decoration:none;transition:color .2s;}
.lang-link:hover{color:#C9A84C;}

/* ── LAYOUT ── */
.wrap{
  max-width:780px;margin:0 auto;
  padding:120px 32px 80px;
  display:flex;flex-direction:column;gap:0;
}

/* ── HEADER ── */
.hd-super{
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:6px;
  color:#6a4a18;text-transform:uppercase;text-align:center;margin-bottom:10px;
}
.hd-title{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,8vw,72px);
  color:#C9A84C;letter-spacing:.12em;text-align:center;line-height:1;
  text-shadow:0 0 60px rgba(201,168,76,.18);
}
.hd-sub{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(12px,1.4vw,15px);color:#8a6a30;text-align:center;
  margin-top:8px;letter-spacing:.4px;
}
.hd-rule{
  width:160px;height:1px;
  background:linear-gradient(90deg,transparent,#6a4a18,transparent);
  margin:18px auto 52px;
}

/* ── EPISODES ── */
.ep-list{display:flex;flex-direction:column;gap:0;}

.ep-row{
  display:flex;align-items:center;gap:28px;
  padding:28px 0;
  border-top:1px solid rgba(90,64,32,.25);
  position:relative;
}
.ep-row:last-child{border-bottom:1px solid rgba(90,64,32,.25);}

.ep-num{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,5vw,52px);
  color:#3a2a10;letter-spacing:.05em;min-width:56px;text-align:center;
  line-height:1;flex-shrink:0;
  transition:color .3s;
}
.ep-row:hover .ep-num{color:#7a5a28;}

.ep-info{flex:1;min-width:0;}
.ep-name{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,4vw,38px);
  color:#c09048;letter-spacing:.1em;line-height:1;
  transition:color .3s;
}
.ep-row:hover .ep-name{color:#C9A84C;}
.ep-series{
  font-size:9px;letter-spacing:3px;color:#5a4020;
  text-transform:uppercase;margin-top:5px;display:block;
  font-family:'Inter',sans-serif;
}
.ep-years{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:11px;color:#4a3418;margin-top:3px;display:block;
}

.ep-links{
  display:flex;flex-direction:column;gap:8px;
  align-items:flex-end;flex-shrink:0;
}
.ep-btn{
  display:inline-block;text-decoration:none;
  font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;
  text-transform:uppercase;
  padding:7px 16px;border-radius:2px;
  transition:all .2s;white-space:nowrap;
}
.ep-btn-album{
  background:transparent;
  border:1px solid rgba(201,168,76,.35);
  color:rgba(201,168,76,.65);
}
.ep-btn-album:hover{
  background:rgba(201,168,76,.08);
  border-color:#C9A84C;color:#C9A84C;
}
.ep-btn-fuentes{
  background:transparent;
  border:1px solid rgba(90,64,32,.4);
  color:#6a4a20;
}
.ep-btn-fuentes:hover{
  border-color:rgba(201,168,76,.4);
  color:rgba(201,168,76,.65);
}

/* Coming soon */
.ep-prox{
  font-family:'Cinzel',serif;font-size:8px;letter-spacing:3px;
  text-transform:uppercase;color:#3a2a10;padding:7px 16px;
  border:1px solid rgba(58,42,16,.5);border-radius:2px;
}
.ep-row.coming .ep-name{color:#4a3418;}
.ep-row.coming .ep-num{color:#2a1e08;}
.ep-row.coming:hover .ep-name{color:#6a4a20;}
.ep-row.coming:hover .ep-num{color:#4a3418;}

/* ── FOOTER ── */
.footer{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin-top:64px;padding-top:32px;
  border-top:1px solid rgba(90,64,32,.2);
}
.footer img{height:80px;width:auto;opacity:.6;transition:opacity .3s;}
.footer img:hover{opacity:.85;}
.footer-brand{
  font-family:'Bebas Neue',sans-serif;font-size:10px;
  letter-spacing:5px;color:#5a4020;text-transform:uppercase;
}

/* ── MOBILE ── */
@media(max-width:600px){
  .wrap{padding:90px 20px 60px;}
  .ep-row{flex-wrap:wrap;gap:16px;}
  .ep-num{min-width:44px;font-size:36px;}
  .ep-links{align-items:flex-start;flex-direction:row;flex-wrap:wrap;}
  .ep-btn{font-size:7px;padding:6px 12px;}
}
</style>
</head>
<body>

<a class="btn-home" href="CRONICAS_ETERNAS_Portada_en.html">⌂ &nbsp;Home</a>
<a class="btn-lang" onclick="localStorage.setItem('ce_lang','es')" href="INDICE.html">
  <span class="lang-link">ES</span><span class="lang-sep">·</span><span class="lang-active">EN</span>
</a>

<div class="wrap">

  <!-- HEADER -->
  <div class="hd-super">First Season · 2026</div>
  <div class="hd-title">Index</div>
  <div class="hd-sub">Episodes · Art · Sources</div>
  <div class="hd-rule"></div>

  <!-- EPISODES -->
  <div class="ep-list">

    <!-- PANDORA -->
    <div class="ep-row">
      <div class="ep-num">I</div>
      <div class="ep-info">
        <div class="ep-name">Pandora</div>
        <span class="ep-series">Greek Mythology</span>
        <span class="ep-years">460 BC – 1951 AD</span>
      </div>
      <div class="ep-links">
        <a class="ep-btn ep-btn-album" href="PANDORA_album_en.html">Art Album</a>
        <a class="ep-btn ep-btn-fuentes" href="PANDORA_fuentes_en.html">Sources &amp; Credits</a>
      </div>
    </div>

    <!-- EVA -->
    <div class="ep-row">
      <div class="ep-num">II</div>
      <div class="ep-info">
        <div class="ep-name">Eve</div>
        <span class="ep-series">Judeo-Christian Tradition</span>
        <span class="ep-years">c. 3000 BC – 2025 AD</span>
      </div>
      <div class="ep-links">
        <a class="ep-btn ep-btn-album" href="EVA_album_en.html">Art Album</a>
        <a class="ep-btn ep-btn-fuentes" href="EVA_fuentes_en.html">Sources &amp; Credits</a>
      </div>
    </div>

    <!-- ENKIDU -->
    <div class="ep-row coming">
      <div class="ep-num">III</div>
      <div class="ep-info">
        <div class="ep-name">Enkidu</div>
        <span class="ep-series">Mesopotamia</span>
        <span class="ep-years">c. 2100 BC</span>
      </div>
      <div class="ep-links">
        <span class="ep-prox">Coming Soon</span>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="ESCARABAJO.jpg" alt="Crónicas Eternas editorial seal">
    <div class="footer-brand">Crónicas Eternas · MMXXVI</div>
  </div>

</div>
</body>
</html>
